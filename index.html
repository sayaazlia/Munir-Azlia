<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url("background_page.gif") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            background: rgba(0,0,0,0.10);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .welcome-text {
            font-size: 3rem;
            color: #5a3e75;
            text-shadow: 2px 2px 5px rgba(255,255,255,0.9);
            margin-bottom: 50px;
            text-align: center;
        }

        .enter-btn {
            background: linear-gradient(135deg, #c4a8e0, #9b7cd1);
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 18px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(90, 62, 117, 0.25);
            transition: all 0.3s ease;
        }

        .enter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(90, 62, 117, 0.35);
            background: linear-gradient(135deg, #b89ada, #8a6dc4);
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1 class="welcome-text">✨ Welcome ✨</h1>
        <button class="enter-btn" onclick="window.location.href='main_page.html'">
            🚀 Enter
        </button>
    </div>
</body>
</html>
